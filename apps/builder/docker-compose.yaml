volumes:
  db:

services:
  db:
    image: ghcr.io/supabase/postgres:15.1.1.55
    # Uncomment to log all queries
    # command: ["postgres", "-c", "log_statement=all", "-c", "listen_addresses=*"]
    restart: unless-stopped
    environment:
      # POSTGRES_USER must be set in the container: dev/backend.sh runs
      # psql -U "$POSTGRES_USER" inside it (unset falls back to the OS user
      # "root", rejected by the supabase image's peer auth usermap)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: webstudio
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - ${PGPORT:-5432}:5432
      # PostgREST shares this container's network (network_mode: service:db),
      # so its port is published here. .env sets POSTGREST_PORT=55433 to match
      # POSTGREST_URL used by the app and e2e tests.
      - ${POSTGREST_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webstudio"]
      interval: 10s
      timeout: 5s
      retries: 25

  # Named "postgrest" to match dev/backend.sh (compose up -d postgrest)
  postgrest:
    image: postgrest/postgrest:v12.2.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://postgres:pass@localhost/webstudio
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-jwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecret}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-jwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecretjwtsecret}
      PGRST_APP_SETTINGS_JWT_EXP: "9999999"
    command: "postgrest"
    network_mode: service:db
