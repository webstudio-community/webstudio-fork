name: Regroup patches

# Manually trigger the patch regroup routine when develop has accumulated too many
# patch commits over main. This is equivalent to the automatic `check-stack` job
# in sync-upstream.yml, but can be run on-demand instead of only after a sync.
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: Fire the regroup routine when develop has more than this many patch commits (0 = always fire)
        type: string
        default: "18"

jobs:
  check-stack:
    name: Fire regroup routine when patch stack exceeds threshold
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Count patch commits and fire routine
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD: ${{ inputs.threshold }}
          ROUTINE_REGROUP_URL: ${{ secrets.ROUTINE_REGROUP_URL }}
          ROUTINE_REGROUP_TOKEN: ${{ secrets.ROUTINE_REGROUP_TOKEN }}
        run: |
          git fetch origin main develop
          COUNT=$(git log origin/main..origin/develop --format='%s' \
            | grep -viE 're-?stamp' | wc -l)
          echo "patch commits on develop: $COUNT (threshold $THRESHOLD)"

          if [ "$THRESHOLD" = "0" ]; then
            echo "Forcing regroup (threshold is 0)"
          elif [ "$COUNT" -le "$THRESHOLD" ]; then
            echo "Stack within threshold ($COUNT <= $THRESHOLD), nothing to do."
            exit 0
          fi

          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("regroup/"))] | length')
          if [ "$OPEN" -gt 0 ]; then
            echo "A regroup/* PR is already open, not firing again."
            exit 0
          fi

          curl -fsS -X POST "$ROUTINE_REGROUP_URL" \
            -H "Authorization: Bearer $ROUTINE_REGROUP_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"develop has $COUNT patch commits over main (threshold $THRESHOLD). Regroup them. origin/main=$(git rev-parse origin/main) origin/develop=$(git rev-parse origin/develop)\"}"
