name: Promote regroup

# The regroup routine pushes regroup/<yyyymm>, and the sync routine pushes
# sync/rebase-<yyyymmdd> after resolving a failed upstream rebase. Each opens
# a PR to main so the regular CI runs on the rewritten patch series. When
# "Main workflow" is green on that exact commit, develop is moved to it (after
# a backup tag), provided develop is still where the routine started from.
# A maintainer can also approve a sync/rebase-* PR by hand (button in the sync
# mail -> approve-sync.yml -> routine labels the PR "approved"): the same
# promotion then runs without waiting for a green CI.
on:
  workflow_run:
    workflows: ["Main workflow"]
    types: [completed]
  pull_request:
    types: [labeled]

concurrency:
  group: promote-regroup
  cancel-in-progress: false

jobs:
  promote:
    name: Promote regroup branch to develop
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       (startsWith(github.event.workflow_run.head_branch, 'regroup/') ||
        startsWith(github.event.workflow_run.head_branch, 'sync/rebase-'))) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'approved' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'sync/rebase-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Promote
        id: promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop "$BRANCH"

          if [ "$(git rev-parse "origin/$BRANCH")" != "$HEAD_SHA" ]; then
            echo "RESULT=branch-moved" >> "$GITHUB_ENV"
            echo "Branch moved since CI ran, not promoting."; exit 0
          fi

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          [ -n "$PR" ] || { echo "RESULT=no-pr" >> "$GITHUB_ENV"; echo "No open PR for $BRANCH"; exit 0; }
          echo "PR=$PR" >> "$GITHUB_ENV"
          EXPECTED=$(gh pr view "$PR" --json body --jq .body \
            | sed -n 's/^Expected-Develop: *\([0-9a-f]\{40\}\).*/\1/p' | head -1)
          [ -n "$EXPECTED" ] || { echo "PR #$PR has no Expected-Develop line."; exit 1; }

          TAG="backup/develop-$(date +%Y%m%d-%H%M)"
          git tag "$TAG" "$EXPECTED" 2>/dev/null || git tag "$TAG" origin/develop
          git push origin "$TAG"

          # --force-with-lease pinned to the sha the regroup started from:
          # fails if develop moved (a PR merged meanwhile), humans decide then.
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git push --force-with-lease=develop:"$EXPECTED" origin "$HEAD_SHA":refs/heads/develop
          echo "RESULT=promoted" >> "$GITHUB_ENV"

          gh pr close "$PR" --delete-branch \
            --comment "CI green: develop promoted to $HEAD_SHA. Backup tag: $TAG."

          # A promoted sync/rebase-* branch resolves the open sync-conflict
          # issues (the failed scheduled rebase that triggered the routine).
          case "$BRANCH" in sync/rebase-*)
            for n in $(gh issue list --label sync-conflict --state open \
                --json number --jq '.[].number'); do
              gh issue close "$n" --comment \
                "Resolved by $BRANCH (PR #$PR): CI green, develop promoted to $HEAD_SHA. Backup tag: $TAG."
            done ;;
          esac

      # The sync routine no longer mails when it opens its PR: the single
      # report goes out here, once the outcome is known (promoted or not).
      # After a manual approval the routine sends its own report, so this
      # step only speaks up when the promotion did not happen.
      - name: Send final sync report
        if: always() && startsWith(env.BRANCH, 'sync/rebase-')
        env:
          MAIL_WEBHOOK_URL: ${{ secrets.SYNC_MAIL_WEBHOOK_URL }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${RESULT:-}" = promoted ]; then
            echo "Approved promotion done, the routine sends the report."; exit 0
          fi
          case "${RESULT:-}" in
            promoted) STATUS="Fixed and promoted"
              DETAIL="develop now points to $HEAD_SHA. Backup tag: ${TAG:-n/a}. Open sync-conflict issues closed." ;;
            branch-moved) STATUS="Manual review needed"
              DETAIL="Promotion was requested but $BRANCH moved after the check: develop was NOT updated." ;;
            no-pr) STATUS="Manual review needed"
              DETAIL="Promotion was requested but no open PR exists for $BRANCH: develop was NOT updated." ;;
            *) STATUS="Failed"
              DETAIL="Promotion was requested but the step failed (outcome: $PROMOTE_OUTCOME): develop was NOT updated. See $RUN_URL" ;;
          esac
          # Not promoted: the maintainer can approve from the mail (one tap on
          # the prefilled issue, handled by approve-sync.yml).
          ACTION=""
          if [ "${RESULT:-}" != promoted ] && [ -n "${PR:-}" ]; then
            APPROVE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/new?labels=sync-approval&title=approve-sync+PR+$PR&body=sha:$HEAD_SHA"
            ACTION=$(printf '\n>>> TO VALIDATE AND PROMOTE develop NOW: <a href="%s">Validate and promote</a>\n(or open the PR and decide: %s/%s/pull/%s)\n' \
              "$APPROVE_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR")
          fi
          BODY=$(gh pr view "${PR:-0}" --json body --jq .body 2>/dev/null | sed '/^Expected-Develop:/d' || true)
          REPORT=$(printf 'Date: %s\nRepo: %s\nStatus: %s\n\n%s\nBranch: %s (PR #%s)\n%s\n--- ROUTINE REPORT (PR description) ---\n%s\n' \
            "$(date +%F)" "$GITHUB_REPOSITORY" "$STATUS" "$DETAIL" "$BRANCH" "${PR:-?}" "$ACTION" "$BODY")
          jq -n \
            --arg objet "[webstudio-fork] Sync upstream - $STATUS - $(date +%F)" \
            --arg message "$(printf '%s' "$REPORT" | sed 's/$/<br>/')" \
            '{objet: $objet, nom: "webstudio-sync-bot", email: "webstudio-sync-bot", message: $message}' \
            | curl -fsS -X POST "$MAIL_WEBHOOK_URL" -H "Content-Type: application/json" -d @-
