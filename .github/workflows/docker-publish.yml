name: Docker — Build & Publish

on:
  # Runs after verify-standalone-deps.yml passes on develop. workflow_run, rather
  # than push or a needs: job, keeps the image from building before that check.
  workflow_run:
    workflows: ["Verify standalone deploy"]
    types: [completed]
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/builder

jobs:
  # One native runner per platform (QEMU arm64 pnpm install hangs); the merge job
  # assembles the multi-arch manifest from the pushed digests.
  build:
    name: Build builder image (${{ matrix.platform }})
    # workflow_run also fires on failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    env:
      # workflow_run: the verified commit, not develop's current tip.
      # pull_request: the PR head, not the ephemeral merge commit.
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          # The merge job writes the summary with the final tags.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/builder/Dockerfile
          platforms: ${{ matrix.platform }}
          # Stamps the served CLI version (<version>-fork-<sha>).
          build-args: |
            GIT_SHA=${{ env.SOURCE_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}
            type=gha,scope=develop-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifest
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    outputs:
      branch-tag: ${{ steps.branch.outputs.tag }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch tag
        id: branch
        run: |
          # GITHUB_REF_NAME is "N/merge" on PRs.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          if [[ "$BRANCH" == "develop" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      # develop → :latest, other branch or PR → :<branch>, release → :<version> + :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.branch.outputs.is_main == 'true') }}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && steps.branch.outputs.is_main == 'false' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      # Retagging leaves the previous manifest and its children untagged: record
      # them so the prune step deletes exactly what this run replaces.
      - name: Capture previous tag digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REG_TOKEN=$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/builder:pull" | jq -r .token)
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          MANIFEST_URL="https://ghcr.io/v2/${{ github.repository_owner }}/builder/manifests"
          > "${{ runner.temp }}/previous-digests.txt"
          for TAG in $(jq -r '.tags[] | split(":") | last' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            # First push of a branch: no tag yet.
            DIGEST=$(curl -fsSL -I -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" \
              "$MANIFEST_URL/$TAG" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
            [ -z "$DIGEST" ] && continue
            echo "$DIGEST" >> "${{ runner.temp }}/previous-digests.txt"
            curl -fsSL -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" "$MANIFEST_URL/$TAG" \
              | jq -r '.manifests[]?.digest' >> "${{ runner.temp }}/previous-digests.txt"
          done
          sort -u -o "${{ runner.temp }}/previous-digests.txt" "${{ runner.temp }}/previous-digests.txt"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf -- "$REGISTRY_IMAGE@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}"

      # Only digests no tag still references.
      - name: Prune dethroned versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANDIDATES="${{ runner.temp }}/previous-digests.txt"
          [ -s "$CANDIDATES" ] || { echo "No previous versions to prune"; exit 0; }

          REG_TOKEN=$(curl -fsSL -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/builder:pull" | jq -r .token)
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          MANIFEST_URL="https://ghcr.io/v2/${{ github.repository_owner }}/builder/manifests"

          > "${{ runner.temp }}/referenced.txt"
          for TAG in $(curl -fsSL -H "Authorization: Bearer $REG_TOKEN" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/builder/tags/list" | jq -r '.tags[]'); do
            curl -fsSL -I -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" "$MANIFEST_URL/$TAG" \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}' >> "${{ runner.temp }}/referenced.txt"
            curl -fsSL -H "Authorization: Bearer $REG_TOKEN" -H "Accept: $ACCEPT" "$MANIFEST_URL/$TAG" \
              | jq -r '.manifests[]?.digest' >> "${{ runner.temp }}/referenced.txt"
          done

          gh api "orgs/${{ github.repository_owner }}/packages/container/builder/versions?per_page=100" \
            --paginate --jq '.[] | (.id|tostring) + " " + .name' > "${{ runner.temp }}/versions.txt"

          while read -r DIGEST; do
            if grep -qxF "$DIGEST" "${{ runner.temp }}/referenced.txt"; then
              echo "Still referenced, keeping: $DIGEST"
              continue
            fi
            ID=$(awk -v d="$DIGEST" '$2==d{print $1}' "${{ runner.temp }}/versions.txt")
            if [ -n "$ID" ]; then
              gh api -X DELETE "orgs/${{ github.repository_owner }}/packages/container/builder/versions/$ID" --silent
              echo "Deleted dethroned version: $DIGEST"
            fi
          done < "$CANDIDATES"

      - name: Write job summary
        run: |
          digest=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}" --format '{{ .Manifest.Digest }}')
          {
            echo "### 🐳 Image published to GHCR"
            echo ""
            echo "| Tag | Pull command |"
            echo "|-----|--------------|"
            jq -r '.tags[] | "| [`\(.)`](https://github.com/${{ github.repository }}/pkgs/container/builder) | `docker pull \(.)` |"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo ""
            echo "**Digest**: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Posts the test image tag on the PR, updating one comment (<!-- test-images -->).
  # Skipped for external forks (read-only token).
  comment-pr:
    name: Comment PR with builder image
    runs-on: ubuntu-24.04
    needs: merge
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      pull-requests: write

    steps:
      - name: Extract image info
        id: image
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          BRANCH_TAG: ${{ needs.merge.outputs.branch-tag }}
        run: |
          set -euo pipefail
          TAG="${REGISTRY_IMAGE}:${BRANCH_TAG}"
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{ .Manifest.Digest }}' 2>/dev/null || echo "unknown")
          SHORT_SHA="${{ github.event.pull_request.head.sha }}" && SHORT_SHA="${SHORT_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHORT_SHA: ${{ steps.image.outputs.short_sha }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/builder-image-comment.md"
          {
            echo "<!-- test-images -->"
            echo "### 🐳 Test image: builder"
            echo ""
            echo "**Tag**: \`$TAG\`"
            echo ""
            echo "**Digest**: \`$DIGEST\`"
            echo ""
            echo "**Platforms**: linux/amd64, linux/arm64"
            echo ""
            echo "📋 For Coolify test bench:"
            echo ""
            echo "\`\`\`bash"
            echo "export BUILDER_IMAGE=$TAG"
            echo "\`\`\`"
            echo ""
            echo "[View package](https://github.com/${{ github.repository }}/pkgs/container/builder) · Updated for \`$SHORT_SHA\` · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$BODY"

          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.user.type == "Bot" and (.body | contains("<!-- test-images -->")))) | first | .id // empty')

          if [ -n "$CID" ]; then
            jq -Rs '{body: .}' "$BODY" | gh api -X PATCH "repos/$REPO/issues/comments/$CID" --input - >/dev/null
            echo "Updated comment $CID on PR #$PR"
          else
            jq -Rs '{body: .}' "$BODY" | gh api -X POST "repos/$REPO/issues/$PR/comments" --input - >/dev/null
            echo "Created comment on PR #$PR"
          fi
