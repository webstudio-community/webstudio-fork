name: Docker — Build & Publish

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/builder

jobs:
  # Each platform builds on its native runner (no QEMU — the emulated arm64
  # pnpm install hangs since the upstream oxc/rolldown/TS7 toolchain
  # migration) and pushes an untagged image by digest. The merge job then
  # assembles the multi-arch manifest from those digests.
  build:
    name: Build builder image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    steps:
      - uses: actions/checkout@v4

      # "linux/amd64" → "linux-amd64" for artifact names and cache scopes
      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          # The per-platform summary would only show an untagged digest push —
          # the merge job writes the real summary with the final tags.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: apps/builder/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}
            type=gha,scope=develop-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & push manifest
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      contents: read
      packages: write   # required for ghcr.io push

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sanitize branch name for use as image tag (pull_request and workflow_dispatch)
      - name: Compute branch tag
        id: branch
        run: |
          # For PR events GITHUB_REF_NAME is "N/merge" — use head_ref instead
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          if [[ "$BRANCH" == "develop" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      # Derive image tags:
      #   push to develop                        → :latest
      #   workflow_dispatch on develop           → :latest
      #   workflow_dispatch on other branch      → :<sanitized-branch>
      #   pull_request                           → :<sanitized-branch>
      #   published release                      → :<version> + :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && steps.branch.outputs.is_main == 'true') }}
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && steps.branch.outputs.is_main == 'false' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf -- "$REGISTRY_IMAGE@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}"

      - name: Write job summary
        run: |
          digest=$(docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ steps.meta.outputs.version }}" --format '{{ .Manifest.Digest }}')
          {
            echo "### 🐳 Image published to GHCR"
            echo ""
            echo "| Tag | Pull command |"
            echo "|-----|--------------|"
            jq -r '.tags[] | "| [`\(.)`](https://github.com/${{ github.repository }}/pkgs/container/builder) | `docker pull \(.)` |"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo ""
            echo "**Digest**: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
