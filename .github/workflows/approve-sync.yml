name: Approve sync

# The sync mail carries a "Validate and promote" button: a link to a prefilled
# issue (label sync-approval, title "approve-sync PR <n>", body "sha:<head>").
# Submitting it fires the sync routine in "finalize" mode; the routine labels
# the PR "approved", which makes promote-regroup.yml move develop to it, then
# sends the final report. The sha pins what was reviewed: if the branch moved
# since the mail, nothing happens.
on:
  issues:
    types: [opened]

jobs:
  approve:
    name: Fire routine to finalize an approved sync PR
    if: contains(github.event.issue.labels.*.name, 'sync-approval')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ACTOR: ${{ github.event.issue.user.login }}
    steps:
      - name: Check and fire
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          refuse() {
            gh issue comment "$ISSUE" --body "Not approved: $1"
            gh issue close "$ISSUE" --reason "not planned"
            echo "$1"; exit 1
          }

          PERM=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          [ "$PERM" = admin ] || refuse "$ACTOR is not a repository admin."

          PR=$(printf '%s' "$TITLE" | sed -n 's/^approve-sync PR \([0-9]\{1,\}\)$/\1/p')
          SHA=$(printf '%s' "$ISSUE_BODY" | sed -n 's/^sha:\([0-9a-f]\{40\}\).*/\1/p' | head -1)
          [ -n "$PR" ] && [ -n "$SHA" ] || refuse "malformed title or body (expected 'approve-sync PR <n>' and 'sha:<40 hex>')."

          read -r STATE BRANCH HEAD < <(gh pr view "$PR" --json state,headRefName,headRefOid \
            --jq '[.state, .headRefName, .headRefOid] | join(" ")')
          [ "$STATE" = OPEN ] || refuse "PR #$PR is $STATE."
          case "$BRANCH" in sync/rebase-*) ;; *) refuse "PR #$PR is not a sync/rebase-* branch." ;; esac
          [ "$HEAD" = "$SHA" ] || refuse "PR #$PR moved since the mail (head is now $HEAD, approved $SHA). Review it again."

          curl -fsS -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"finalize PR #$PR sha:$SHA (approved by $ACTOR)\"}"

          gh issue comment "$ISSUE" --body "Approved by $ACTOR. Routine fired to finalize PR #$PR ($SHA): it labels the PR approved, develop is then promoted, and the final report is mailed."
          gh issue close "$ISSUE" --reason completed
