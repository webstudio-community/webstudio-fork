name: Docker — Cleanup PR images

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Delete branch image tag and prune untagged
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    steps:
      - name: Compute branch tag
        if: github.event_name == 'pull_request'
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "tag=$SAFE" >> "$GITHUB_OUTPUT"

      # Multi-arch aware: deletes the platform children too.
      - name: Delete branch image tag
        if: github.event_name == 'pull_request'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: builder
          delete-tags: ${{ steps.branch.outputs.tag }}

      # Manual full sweep of untagged versions. older-than spares in-flight builds.
      - name: Prune untagged images
        if: github.event_name == 'workflow_dispatch'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: builder
          delete-untagged: true
          older-than: 1 hour
          validate: true
