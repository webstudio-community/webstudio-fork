name: Build Builder E2E prerequisites

description: Build the Builder and package its E2E schema and dependencies.

inputs:
  submodules-ssh-key:
    description: SSH key for private E2E dependencies.
    required: false

outputs:
  shards:
    description: Filename-derived E2E shard matrix.
    value: ${{ steps.shards.outputs.value }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/submodules-checkout
      with:
        submodules-ssh-key: ${{ inputs.submodules-ssh-key }}

    - uses: ./.github/actions/ci-setup
      with:
        run-scripts: "true"

    - name: Discover shards
      id: shards
      shell: bash
      run: |
        shards=$(pnpm --dir apps/builder exec tsx ./e2e/print-shards.ts)
        SHARDS="$shards" node -e '
          const shards = JSON.parse(process.env.SHARDS);
          if (shards.length !== 10 || shards.some(({ shard, partition }, index) =>
            shard !== `shard-${index + 1}` || partition !== "")) {
            throw new Error("Builder E2E shard matrix changed; update the workflow matrix before running CI.");
          }
        '
        echo "value=$shards" >> "$GITHUB_OUTPUT"

    # Community fork: the fork's migrations (and any lockfile change) give a
    # schema fingerprint upstream never commits a snapshot for, so the snapshot
    # is generated here when missing, cached by fingerprint, and handed to the
    # shards through the builder-e2e-schema artifact. Runs before the Builder
    # build so shards waiting on it are not delayed by the build.
    - name: Identify schema snapshot
      id: schema
      shell: bash
      run: |
        ROOT_DIR="$PWD"
        source apps/builder/backend/lib.sh
        fingerprint="$(builder_backend_schema_fingerprint)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        echo "path=apps/builder/e2e/schema/schema-$fingerprint.sql" >> "$GITHUB_OUTPUT"

    - name: Cache schema snapshot
      id: schema-cache
      if: hashFiles(steps.schema.outputs.path) == ''
      uses: actions/cache@v5
      with:
        path: ${{ steps.schema.outputs.path }}
        key: builder-e2e-schema-v1-${{ steps.schema.outputs.fingerprint }}

    - name: Generate schema snapshot
      shell: bash
      env:
        SCHEMA_SNAPSHOT: ${{ github.workspace }}/${{ steps.schema.outputs.path }}
      run: |
        if [ -s "$SCHEMA_SNAPSHOT" ]; then
          echo "Using schema snapshot $SCHEMA_SNAPSHOT"
          exit 0
        fi
        bash apps/builder/e2e/run.sh schema-cache
        test -s "$SCHEMA_SNAPSHOT"

    - name: Upload schema snapshot
      uses: actions/upload-artifact@v6
      with:
        name: builder-e2e-schema
        retention-days: 7
        path: ${{ steps.schema.outputs.path }}

    - name: Identify Builder build inputs
      id: build-key
      shell: bash
      run: |
        echo "hash=$(git ls-files -s -- . ':!apps/builder/e2e/**' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache Builder build
      id: build-cache
      uses: actions/cache@v5
      with:
        path: |
          apps/builder/build/server
          apps/builder/build/client/assets
          packages/*/lib
        key: builder-e2e-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-key.outputs.hash }}

    - name: Build Builder
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @webstudio-is/builder build

    - name: Build generated React Router components
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @webstudio-is/sdk-components-react-router build

    - name: Check Builder build
      shell: bash
      run: |
        test -d apps/builder/build/server
        test -d apps/builder/build/client/assets
        test -f packages/sdk-components-react-router/lib/components.js

    - name: Upload prerequisites
      uses: actions/upload-artifact@v6
      with:
        name: builder-e2e-build
        retention-days: 7
        path: |
          apps/builder/build/server
          apps/builder/build/client/assets
          packages/*/lib
